[package]
name = "extrator-ui"
version = "0.1.1"
edition = "2021"
description = "Interface nativa (egui) do Extrator de Texto"
license = "Proprietary"
publish = false

[[bin]]
name = "extrator"
path = "src/main.rs"

[workspace]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
png = "0.18.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
